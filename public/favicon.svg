<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle for better visibility on light/dark backgrounds -->
  <circle cx="32" cy="32" r="30" fill="#1e1e1e"/>

  <!-- Book spine and shadow -->
