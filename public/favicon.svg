  <!-- Book cover (left page) -->
  <path d="M12 12 L24 14 L24 50 L12 48 Z" fill="#4a9eff"/>

  <!-- Book cover (right page) -->
  <path d="M40 14 L52 12 L52 48 L40 50 Z" fill="#7b61ff"/>

  <!-- Book pages detail (left) -->
  <rect x="13" y="16" width="10" height="1" fill="#fff" opacity="0.3"/>
  <rect x="13" y="20" width="10" height="1" fill="#fff" opacity="0.3"/>
  <rect x="13" y="24" width="10" height="1" fill="#fff" opacity="0.3"/>
  <rect x="13" y="28" width="10" height="1" fill="#fff" opacity="0.3"/>

  <!-- Book pages detail (right) -->
  <rect x="41" y="16" width="10" height="1" fill="#fff" opacity="0.3"/>
  <rect x="41" y="20" width="10" height="1" fill="#fff" opacity="0.3"/>
  <rect x="41" y="24" width="10" height="1" fill="#fff" opacity="0.3"/>
  <rect x="41" y="28" width="10" height="1" fill="#fff" opacity="0.3"/>

  <!-- Highlight on spine -->
  <rect x="30" y="14" width="4" height="36" fill="#fff" opacity="0.1"/>

  <!-- Small decorative bookmark -->
  <path d="M32 12 L32 22 L36 19 L32 12 Z" fill="#ffcc00"/>
</svg>