<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle for better visibility -->
  <circle cx="32" cy="32" r="30" fill="#1e1e1e"/>

  <!-- Book spine (the visible part on the left) -->
  <rect x="14" y="16" width="8" height="32" fill="#5d4037" rx="1"/>

  <!-- Book spine highlight -->
  <rect x="14" y="16" width="2" height="32" fill="#6d4c41" opacity="0.5"/>

  <!-- Book spine shadow -->
  <rect x="20" y="16" width="2" height="32" fill="#3e2723" opacity="0.4"/>

  <!-- Pages (white edges visible from the side) -->
  <rect x="22" y="17" width="28" height="30" fill="#f5f5f5"/>

  <!-- Page shadows/depth lines -->
  <line x1="22" y1="18" x2="50" y2="18" stroke="#ddd" stroke-width="0.5"/>
  <line x1="22" y1="19" x2="50" y2="19" stroke="#ddd" stroke-width="0.5"/>
  <line x1="22" y1="20" x2="50" y2="20" stroke="#ddd" stroke-width="0.5"/>
  <line x1="22" y1="21" x2="50" y2="21" stroke="#ddd" stroke-width="0.5"/>
  <line x1="22" y1="22" x2="50" y2="22" stroke="#ddd" stroke-width="0.5"/>

  <!-- Back cover (right edge) -->
  <rect x="50" y="16" width="4" height="32" fill="#6d4c41" rx="1"/>

  <!-- Back cover shadow -->
  <rect x="52" y="16" width="2" height="32" fill="#3e2723" opacity="0.3"/>

  <!-- Top page edge detail -->
  <rect x="22" y="16" width="28" height="1" fill="#e0e0e0"/>

  <!-- Bottom page edge detail -->
  <rect x="22" y="47" width="28" height="1" fill="#d0d0d0"/>

  <!-- Decorative lines on spine -->
  <rect x="15" y="20" width="6" height="1" fill="#8d6e63" opacity="0.6"/>
  <rect x="15" y="26" width="6" height="0.5" fill="#8d6e63" opacity="0.4"/>
  <rect x="15" y="30" width="6" height="0.5" fill="#8d6e63" opacity="0.4"/>

  <!-- Title text suggestion on spine (just decorative lines) -->
  <rect x="16" y="34" width="4" height="8" fill="#4a9eff" opacity="0.4" rx="0.5"/>
</svg>